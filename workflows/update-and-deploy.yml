name: Update and deploy show calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Collect upcoming shows
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/update_events.py

      - name: Save refreshed event data
        run: |
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json run-status.json cache/ticketmaster-attractions.json
          if git diff --cached --quiet; then
            echo "No event-data changes to commit."
          else
            git commit -m "chore: refresh show listings [skip ci]"
            git push
          fi

      - name: Build multi-page static site
        run: python scripts/build_site.py --output _site

      - name: Verify generated pages
        run: |
          test -s _site/index.html
          test -s _site/shows/index.html
          test -s _site/shows/this-month/index.html
          test -s _site/festivals/index.html
          test -s _site/new-shows/index.html
          test -s _site/artists/index.html
          test -s _site/submit/index.html
          echo "Core multi-page site files generated successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
