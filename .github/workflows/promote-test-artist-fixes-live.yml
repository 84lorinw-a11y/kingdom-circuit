name: Promote verified test artist fixes to live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-test-artist-fixes-live.yml"

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install persistent live promotion pipeline
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_live_artist_overrides.py
          python scripts/apply_live_artist_overrides.py --install

      - name: Sync canonical registry and apply verified source fixes
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_verified_artist_registry.py
          python scripts/sync_verified_artist_registry.py
          python scripts/apply_live_artist_overrides.py --source .

      - name: Verify promoted source state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          excluded = {"chad jones", "erica mason", "big holy"}
          artists = json.loads(Path("config/artists.json").read_text(encoding="utf-8"))
          by_name = {a["name"].casefold(): a for a in artists}
          assert excluded.isdisjoint(by_name), excluded & set(by_name)
          assert [a["rosterOrder"] for a in artists] == list(range(1, len(artists) + 1))

          expected = {
              "kelo": "https://open.spotify.com/artist/6j8t8rQzrAtRx5tYImodgd",
              "dkg kie": "https://open.spotify.com/artist/1eeYg6dFkaRT5GA0lsCVHA",
              "braille": "https://open.spotify.com/artist/6RYTz1tFNDF2qP0mwqEwDO",
              "canton jones": "https://open.spotify.com/artist/3nzEXHMRFWTw4zt3pVRv6V",
              "jay-way": "https://open.spotify.com/artist/1RDbE3dM2bNNSTh88R4MQ7",
              "stixx aka conejo": "https://open.spotify.com/artist/3khYLvZ6GmLlPMPlTfMTBr",
              "ruslan": "https://open.spotify.com/artist/2GEXrCflKZ5S5ZHBM4LNcV",
          }
          for name, spotify in expected.items():
              assert by_name[name]["spotifyProfile"] == spotify, name
              assert by_name[name]["sourceRegistryVerified"] is True, name

          caleb = by_name["caleb gordon"]
          assert "ARTIST_HEADSHOT_36.jpg" in caleb["imageUrl"]
          assert caleb["instagramProfile"] == "https://www.instagram.com/calebfromeden/"

          updates = json.loads(Path("config/verified-artist-registry-updates.json").read_text(encoding="utf-8"))
          update_names = {str(x.get("name") or "").casefold() for x in updates}
          assert excluded.isdisjoint(update_names), excluded & update_names
          for name in expected:
              assert name in update_names, name

          app = Path("app.js").read_text(encoding="utf-8").casefold()
          roster_block = app.split("const artist_roster_order =", 1)[1].split("];", 1)[0]
          for name in excluded:
              assert name not in roster_block, name
          assert "enhanceverifiedartistimages" in app

          events = json.loads(Path("events.json").read_text(encoding="utf-8"))
          for event in events:
              assert not any(name in str(event.get("title") or "").casefold() for name in excluded), event.get("title")
              assert all(str(a).casefold() not in excluded for a in event.get("artists") or []), event.get("title")

          print("Verified live source promotion:", len(artists), "artists")
          PY

      - name: Commit promoted live state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-test-artist-fixes-live.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes to commit."
          else
            git commit -m "Promote verified artist fixes to live"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                PUSHED=1
                break
              fi
              git fetch origin main
              git rebase origin/main
            done
            test "$PUSHED" -eq 1
          fi

      - name: Deploy updated live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-and-deploy.yml --ref main
