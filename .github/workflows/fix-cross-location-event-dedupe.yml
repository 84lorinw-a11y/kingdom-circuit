name: Fix cross-location event dedupe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-cross-location-event-dedupe.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply dedupe repair
        run: python scripts/fix_cross_location_dedupe_once.py

      - name: Validate syntax
        run: |
          python -m py_compile scripts/update_events.py scripts/fix_cross_location_dedupe_once.py
          node --check app.js

      - name: Save repair
        run: |
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/update_events.py events.json
          if git diff --cached --quiet; then
            echo "Dedupe repair already applied."
          else
            git commit -m "Fix event dedupe across provider location variants [skip ci]"
            git push origin HEAD:main
          fi

      - name: Refresh and deploy production
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-and-deploy.yml --ref main
