name: Sync Don Ready verified profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-don-ready-profile.yml'

permissions:
  contents: write

jobs:
  sync-don-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified Don Ready profile and image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          updates_path = root / 'config' / 'verified-artist-registry-updates.json'
          artists_path = root / 'config' / 'artists.json'
          finalizer_path = root / 'scripts' / 'finalize_live_event_images.py'

          website = 'https://www.donreadymusic.com/'
          instagram = 'https://www.instagram.com/donreadymusic/'
          spotify = 'https://open.spotify.com/artist/5kQnpfa9Qp5lNSOThWVnFl'
          youtube = 'https://www.youtube.com/@donreadymusic'
          bandsintown = 'https://www.bandsintown.com/a/11718080-don-ready'
          press_photo = 'https://ugc.production.linktr.ee/f87bf85e-d8ca-4d35-92f8-ac16dd0f03f3_Copy-of-Feb-2026---White-Press-Pic--elijah-sten-1.jpeg'
          stale_ticketmaster_image = 'https://s1.ticketm.net/dam/a/295/bf4a2e20-facf-46e6-904e-c19f998cb295_SOURCE'

          updates = json.loads(updates_path.read_text(encoding='utf-8'))
          update = next((x for x in updates if x.get('name') == 'Don Ready'), None)
          assert update is not None, 'Don Ready missing from verified registry updates'
          update.update({
              'website': website,
              'instagramProfile': instagram,
              'spotifyProfile': spotify,
              'youtubeProfile': youtube,
              'officialImageSource': instagram,
          })
          updates_path.write_text(json.dumps(updates, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          artists = json.loads(artists_path.read_text(encoding='utf-8'))
          artist = next((x for x in artists if x.get('name') == 'Don Ready'), None)
          assert artist is not None, 'Don Ready missing from config/artists.json'
          artist.update({
              'website': website,
              'officialProfile': website,
              'instagramProfile': instagram,
              'spotifyProfile': spotify,
              'youtubeProfile': youtube,
              'officialImageSource': instagram,
              'imageUrl': press_photo,
              'imagePosition': 'center',
              'preferArtistImage': True,
              'bandsintownProfile': bandsintown,
              'sourceRegistryVerified': True,
          })
          artists_path.write_text(json.dumps(artists, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          text = finalizer_path.read_text(encoding='utf-8')
          if stale_ticketmaster_image not in text:
              marker = 'STALE_IMAGE_URLS = {\n'
              assert marker in text
              text = text.replace(marker, marker + f'    "{stale_ticketmaster_image}",\n', 1)

          if '    "don ready": [' not in text:
              marker = '    "mike teezy": [\n'
              assert marker in text
              block = (
                  '    "don ready": [\n'
                  f'        "{press_photo}",\n'
                  f'        "https://open.voidware.de/artist/5kQnpfa9Qp5lNSOThWVnFl",\n'
                  '    ],\n'
              )
              text = text.replace(marker, block + marker, 1)

          finalizer_path.write_text(text, encoding='utf-8')

          print('Don Ready registry, direct artist photo, and event-image repair configured.')
          PY

      - name: Regenerate verified registry data
        run: python scripts/sync_verified_artist_registry.py

      - name: Validate Don Ready profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          artists = json.loads(Path('config/artists.json').read_text(encoding='utf-8'))
          artist = next(x for x in artists if x.get('name') == 'Don Ready')
          assert artist['website'] == 'https://www.donreadymusic.com/'
          assert artist['instagramProfile'] == 'https://www.instagram.com/donreadymusic/'
          assert artist['spotifyProfile'] == 'https://open.spotify.com/artist/5kQnpfa9Qp5lNSOThWVnFl'
          assert artist['youtubeProfile'] == 'https://www.youtube.com/@donreadymusic'
          assert artist['imageUrl'].endswith('Copy-of-Feb-2026---White-Press-Pic--elijah-sten-1.jpeg')
          assert artist['bandsintownProfile'] == 'https://www.bandsintown.com/a/11718080-don-ready'

          finalizer = Path('scripts/finalize_live_event_images.py').read_text(encoding='utf-8')
          assert '"don ready": [' in finalizer
          assert 'bf4a2e20-facf-46e6-904e-c19f998cb295_SOURCE' in finalizer
          print('Don Ready profile validation passed.')
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Save verified Don Ready updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/verified-artist-registry-updates.json config/verified-artist-websites.json config/artists.json app.js scripts/finalize_live_event_images.py
          if git diff --cached --quiet; then
            echo "Don Ready profile is already current."
            exit 0
          fi
          git commit -m "Update Don Ready verified profile and image"
          git push origin HEAD:main
