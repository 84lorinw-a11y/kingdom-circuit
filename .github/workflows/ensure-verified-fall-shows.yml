name: Ensure verified Fall shows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure:
    if: ${{ !contains(github.event.head_commit.message || '', '[verified fall sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin verified Eventbrite shows, Flavor Fest Friday, and HVO artwork
        run: python scripts/ensure_verified_fall_2026_shows.py

      - name: Preserve verified Miles Minnick and CJ Emulous corrections
        run: python scripts/apply_miles_cj_fall_2026_repairs.py

      - name: Save verified show corrections
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "Ensure verified Fall 2026 shows [verified fall sync]" \
            --replay "python scripts/replay_source_update.py fall" \
            events.json supplemental-events.json config/manual-events.json config/artists.json app.js coverage-gaps.json
