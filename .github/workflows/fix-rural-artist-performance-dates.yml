name: Fix Rural Festival artist performance dates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run artist performance date installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install durable artist performance-date support
        run: |
          set -euo pipefail
          python scripts/_install_artist_performance_dates.py
          python -m py_compile scripts/apply_live_artist_overrides.py
          git config user.name 'kingdom-circuit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_live_artist_overrides.py
          git commit -m 'Show artist-specific festival performance dates'
          git push origin HEAD:main
