name: Verify public primary event images

on:
  push:
    paths:
      - '.github/workflows/verify-public-primary-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public image bytes and rendered pages
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://kingdomcircuit.com'
          RARE='/assets/artists/rare-of-breed-primary.jpg'
          YUMIYA='/assets/artists/yumiya-primary.jpg'
          URLS=(
            '/event/rare-of-breed-at-south-dakota-military-heritage-alliance-inc-2026-09-02-sioux-falls-3d5849/'
            '/event/rare-of-breed-at-mt-carmel-baptist-church-2026-09-04-lake-ozark-ab5b35/'
            '/event/rare-of-breed-at-clarksville-high-school-fine-arts-building-2026-09-05-clarksville-e30119/'
            '/event/the-genesis-show-all-women-s-chh-event-2026-09-19-roswell-9d321d/'
          )

          # Wait for GitHub Pages/CDN propagation of the new deployment.
          for attempt in $(seq 1 20); do
            html="$(curl -fsS --max-time 15 "$BASE${URLS[0]}" || true)"
            if grep -q 'rare-of-breed-primary.jpg' <<<"$html"; then
              echo "New public deployment visible on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'Public site never exposed the new Rare of Breed image path'
              exit 1
            fi
            sleep 3
          done

          curl -fsS --retry 3 --max-time 20 "$BASE$RARE" -o /tmp/rare-live.jpg
          curl -fsS --retry 3 --max-time 20 "$BASE$YUMIYA" -o /tmp/yumiya-live.jpg
          test "$(sha256sum /tmp/rare-live.jpg | cut -d' ' -f1)" = "$(sha256sum assets/artists/rare-of-breed-primary.jpg | cut -d' ' -f1)"
          test "$(sha256sum /tmp/yumiya-live.jpg | cut -d' ' -f1)" = "$(sha256sum assets/artists/yumiya-primary.jpg | cut -d' ' -f1)"
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/rare-live.jpg'), Path('/tmp/yumiya-live.jpg')]:
              b=p.read_bytes()
              assert b[:2] == b'\xff\xd8' and b[-2:] == b'\xff\xd9', (p, b[:2], b[-2:])
              print(p, len(b), 'valid JPEG')
          PY

          for u in "${URLS[@]}"; do
            curl -fsS --retry 3 --max-time 20 "$BASE$u" -o /tmp/page.html
            if [[ "$u" == *genesis* ]]; then expected='yumiya-primary.jpg'; else expected='rare-of-breed-primary.jpg'; fi
            grep -q "$expected" /tmp/page.html
            echo "HTML OK: $u -> $expected"
          done

          BROWSER=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then BROWSER="$candidate"; break; fi
          done
          if [ -z "$BROWSER" ]; then
            echo 'No Chrome/Chromium executable available for rendered-DOM check'
            exit 1
          fi
          echo "Using browser: $BROWSER"

          i=0
          for u in "${URLS[@]}"; do
            i=$((i+1))
            "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$BASE$u" > "/tmp/dom-$i.html" 2>/tmp/chrome.err
            if [[ "$u" == *genesis* ]]; then expected='yumiya-primary.jpg'; else expected='rare-of-breed-primary.jpg'; fi
            grep -q "$expected" "/tmp/dom-$i.html"
            # The event media itself must not have mutated to the generic fallback after browser load.
            python - "$expected" "/tmp/dom-$i.html" <<'PY'
          import re,sys
          expected=sys.argv[1]
          text=open(sys.argv[2],encoding='utf-8',errors='ignore').read()
          m=re.search(r'<div[^>]*class="[^"]*event-detail-media[^"]*"[^>]*>\s*(<img\b[^>]*>)', text, re.I|re.S)
          assert m, 'event-detail-media image not found'
          tag=m.group(1)
          assert expected in tag, tag
          assert 'src="/assets/event-fallback.webp"' not in tag, tag
          print('Rendered event image OK:', tag[:260])
          PY
          done
