name: Merge verified artist seed events

on:
  push:
    branches: [main]
    paths:
      - "config/artist-website-seed-events.json"
      - "scripts/merge_artist_website_events.py"
      - ".github/workflows/merge-verified-artist-seeds.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-verified-artist-seeds
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate verified artist seeds
        run: python -m unittest tests.test_artist_website_ingestion -v

      - name: Merge verified artist seeds into calendar
        run: python scripts/merge_artist_website_events.py

      - name: Save merged calendar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- events.json run-status.json
          if git diff --cached --quiet; then
            echo "Verified artist seeds already merged."
            exit 0
          fi

          git commit -m "chore: merge verified artist seed events"
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "Push raced with another automation commit; rebasing and retrying ($attempt/3)."
            git fetch origin main
            git rebase origin/main
          done
          if [ "$PUSHED" -ne 1 ]; then
            echo "Unable to save verified artist seed events after retries."
            exit 1
          fi
