name: Merge verified artist seed events

on:
  push:
    branches: [main]
    paths:
      - "config/artist-website-seed-events.json"
      - "scripts/merge_artist_website_events.py"
      - ".github/workflows/merge-verified-artist-seeds.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-verified-artist-seeds
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate verified artist seeds
        run: python -m unittest tests.test_artist_website_ingestion -v

      - name: Merge verified artist seeds into calendar
        run: python scripts/merge_artist_website_events.py

      - name: Save merged calendar
        run: |
          python scripts/publish_automation_changes.py \
            --message "chore: merge verified artist seed events" \
            --replay "python -m unittest tests.test_artist_website_ingestion -q" \
            --replay "python scripts/merge_artist_website_events.py" \
            events.json run-status.json
