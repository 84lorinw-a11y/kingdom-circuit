name: Verify homepage primary artist images

on:
  push:
    paths:
      - '.github/workflows/verify-home-primary-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public homepage after dynamic render
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://kingdomcircuit.com'
          GUARD='home-primary-image-guard.js?v=20260830-home-1'
          RARE='rare-of-breed-primary.jpg?v=20260830-home-1'
          YUMIYA='yumiya-primary.jpg?v=20260830-home-1'

          for attempt in $(seq 1 30); do
            html="$(curl -fsS --max-time 15 "$BASE/" || true)"
            if grep -q "$GUARD" <<<"$html"; then
              echo "Homepage guard visible publicly on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Homepage guard never became public'
              exit 1
            fi
            sleep 3
          done

          curl -fsS --retry 3 --max-time 20 "$BASE/assets/artists/rare-of-breed-primary.jpg?v=20260830-home-1" -o /tmp/rare.jpg
          curl -fsS --retry 3 --max-time 20 "$BASE/assets/artists/yumiya-primary.jpg?v=20260830-home-1" -o /tmp/yumiya.jpg
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/rare.jpg'), Path('/tmp/yumiya.jpg')]:
              b=p.read_bytes()
              assert b[:2] == b'\xff\xd8' and b[-2:] == b'\xff\xd9', (p, b[:4], b[-4:])
              assert len(b) > 10000, (p, len(b))
              print(p.name, len(b), 'valid public JPEG')
          PY

          BROWSER=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then BROWSER="$candidate"; break; fi
          done
          test -n "$BROWSER"

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 26_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          "$BROWSER" --headless --no-sandbox --disable-gpu --user-agent="$UA" --virtual-time-budget=8000 --dump-dom "$BASE/" > /tmp/home.html 2>/tmp/chrome.err

          python - <<'PY'
          import re
          text=open('/tmp/home.html',encoding='utf-8',errors='ignore').read()
          cards=re.findall(r'<article\b[^>]*class="[^"]*event-card[^"]*"[^>]*>.*?</article>', text, re.I|re.S)
          checks={
              'Rare of Breed at South Dakota Military Heritage Alliance, Inc.':'rare-of-breed-primary.jpg?v=20260830-home-1',
              "The Genesis Show – All Women's CHH Event":'yumiya-primary.jpg?v=20260830-home-1',
          }
          for title, expected in checks.items():
              matches=[c for c in cards if title in c]
              assert matches, f'missing homepage card: {title}'
              tag=re.search(r'<img\b[^>]*>', matches[0], re.I|re.S)
              assert tag, title
              img=tag.group(0)
              assert expected in img, (title, img)
              assert 'src="/assets/event-fallback.webp"' not in img, (title, img)
              print('Homepage rendered image OK:', title, '->', expected)
          PY
