name: Fix Echo Nights 26 official artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/echo-nights-artwork-trigger.txt'

permissions:
  contents: write

jobs:
  fix-echo-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official TicketSpice artwork and update event
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import urllib.request
          from pathlib import Path
          from urllib.parse import urljoin

          EVENT_URL = 'https://atkministry.ticketspice.com/echo-nights-26'
          EVENT_ID = 'manual:ticketspice:echo-nights-26-brookfield-2026'
          UA = 'Mozilla/5.0 (Kingdom Circuit event artwork verifier)'

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read(), response.headers.get('Content-Type', '')

          page_bytes, _ = fetch(EVENT_URL)
          page = page_bytes.decode('utf-8', errors='ignore')

          patterns = [
              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
              r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image["\']',
          ]
          image_url = None
          for pattern in patterns:
              match = re.search(pattern, page, flags=re.I)
              if match:
                  image_url = html.unescape(match.group(1)).strip()
                  break

          if not image_url:
              # TicketSpice pages sometimes expose the poster only as a large image element.
              candidates = re.findall(r'<img[^>]+src=["\']([^"\']+)', page, flags=re.I)
              candidates = [html.unescape(x).strip() for x in candidates]
              candidates = [x for x in candidates if x and not x.startswith('data:')]
              if candidates:
                  image_url = candidates[0]

          if not image_url:
              raise SystemExit('Could not locate official TicketSpice artwork URL')

          image_url = urljoin(EVENT_URL, image_url)
          image_bytes, content_type = fetch(image_url)
          if len(image_bytes) < 10000:
              raise SystemExit(f'Artwork download unexpectedly small: {len(image_bytes)} bytes from {image_url}')

          if image_bytes.startswith(b'\x89PNG\r\n\x1a\n'):
              ext = 'png'
          elif image_bytes[:3] == b'\xff\xd8\xff':
              ext = 'jpg'
          elif image_bytes.startswith(b'RIFF') and image_bytes[8:12] == b'WEBP':
              ext = 'webp'
          else:
              ct = content_type.lower()
              if 'png' in ct:
                  ext = 'png'
              elif 'webp' in ct:
                  ext = 'webp'
              elif 'jpeg' in ct or 'jpg' in ct:
                  ext = 'jpg'
              else:
                  raise SystemExit(f'Unrecognized artwork format: {content_type} from {image_url}')

          assets = Path('assets/events')
          assets.mkdir(parents=True, exist_ok=True)
          for old in assets.glob('echo-nights-26.*'):
              old.unlink()
          dest = assets / f'echo-nights-26.{ext}'
          dest.write_bytes(image_bytes)

          path = Path('supplemental-events.json')
          events = json.loads(path.read_text(encoding='utf-8'))
          target = next((e for e in events if e.get('id') == EVENT_ID), None)
          if target is None:
              raise SystemExit('Echo Nights 26 event record not found')

          target['image'] = dest.as_posix()
          target['imageType'] = 'event_artwork'
          target['imagePosition'] = 'center top'
          target['imageOverride'] = True
          target['imageSource'] = 'ATK Ministry official TicketSpice artwork'
          target['imageSourceUrl'] = EVENT_URL
          path.write_text(json.dumps(events, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          print(f'Official artwork: {image_url}')
          print(f'Saved: {dest} ({len(image_bytes)} bytes)')
          PY

      - name: Commit official artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kingdom-circuit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supplemental-events.json assets/events/echo-nights-26.*
          if git diff --cached --quiet; then
            echo 'Echo Nights artwork already correct.'
            exit 0
          fi
          git commit -m 'fix: use official Echo Nights 26 artwork'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
