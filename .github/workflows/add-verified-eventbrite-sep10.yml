            },
            {
              "id": "eventbrite:rare-of-breed-jacksonville-2026",
              "title": "Rare of Breed",
              "startDate": "2026-10-16",
              "startTime": "19:00",
              "timezone": "America/New_York",
              "venue": "Murray Hill Theatre",
              "address": "932 Edgewood Ave S",
              "city": "Jacksonville",
              "state": "FL",
              "country": "US",
              "artists": ["Rare of Breed", "DJ Winn"],
              "headliner": "Rare of Breed",
              "eventType": "concert",
              "status": "scheduled",
              "ticketUrl": "https://www.eventbrite.com/e/rare-of-breed-tickets-1986268845586",
              "officialUrl": "https://www.eventbrite.com/e/rare-of-breed-tickets-1986268845586",
              "image": "",
              "price": "",
              "sourceName": "Official Eventbrite listing",
              "authority": "venue_ticket",
              "confidence": "high",
              "lineupExplicit": True,
              "sources": [{"name":"Official Eventbrite listing","url":"https://www.eventbrite.com/e/rare-of-breed-tickets-1986268845586","type":"eventbrite","authority":"venue_ticket","priority":94}]
            }
          ]

          for event in events:
              by_id[event['id']] = event
          merged = list(by_id.values())
          merged.sort(key=lambda x: (str(x.get('startDate','9999')), str(x.get('startTime','')), str(x.get('title',''))))
          path.write_text(json.dumps(merged, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('Verified Eventbrite events ensured:', len(events))
          PY

      - name: Commit show additions
        run: |
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supplemental-events.json
          if ! git diff --cached --quiet; then
            git commit -m "Add 5 verified Eventbrite shows [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy refreshed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/workflows/update-and-deploy.yml/dispatches -f ref=main

