name: Add verified Eventbrite discoveries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-verified-eventbrite-sep10.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  add-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add five verified Eventbrite shows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('supplemental-events.json')
          rows = json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
          by_id = {str(x.get('id')): x for x in rows if isinstance(x, dict) and x.get('id')}

          events = [
            {
              "id": "eventbrite:truthx-yung-kriss-brandon-2026",
              "title": "TruthX Concert 2026",
              "startDate": "2026-09-12",
              "startTime": "19:00",
              "timezone": "America/New_York",
              "venue": "Brandon High School",
              "address": "1101 Victoria Street",
              "city": "Brandon",
              "state": "FL",
              "country": "US",
              "artists": ["Yung Kriss"],
              "headliner": "Yung Kriss",
              "eventType": "concert",
              "status": "scheduled",
