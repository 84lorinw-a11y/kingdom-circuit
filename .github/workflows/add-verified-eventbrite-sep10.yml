name: Add verified Eventbrite discoveries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-verified-eventbrite-sep10.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  add-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish reviewed shows and repair HVO artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUSHED=0
          for attempt in 1 2 3 4 5; do
            python scripts/apply_verified_show_repairs.py
            git add supplemental-events.json events.json config/manual-events.json

            if git diff --cached --quiet; then
              echo "Reviewed show data is already current."
              PUSHED=1
              break
            fi

            git commit -m "Publish verified shows and HVO artwork [skip ci]"
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi

            echo "Another automation updated main; reloading latest main and reapplying reviewed show repairs ($attempt/5)."
            git fetch origin main
            git reset --hard origin/main
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "Unable to save reviewed show data after 5 race-safe retries."
            exit 1
          fi

      - name: Deploy refreshed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/workflows/update-and-deploy.yml/dispatches -f ref=main
