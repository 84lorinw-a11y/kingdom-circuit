name: Fix event image cache pipeline

on:
  push:
    paths:
      - '.github/workflows/fix-event-image-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make event images cache-safe and runtime-locked
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          TOKEN = "kc-20260829-2050"
          VERSIONED_SCRIPT = "assets/event-image-repair-kc2050.js"
          VERSIONED_SCRIPT_URL = "/assets/event-image-repair-kc2050.js"

          # 1) Runtime JS: never rewrite a primary image that the final artifact has
          # explicitly locked, and use cache-busted primary image URLs for these two artists.
          js_path = Path("assets/event-image-repair.js")
          js = js_path.read_text(encoding="utf-8")
          js = re.sub(
              r'"yumiya!": \[[^\n]+\],',
              f'"yumiya!": ["/assets/artists/yumiya-primary.jpg?v={TOKEN}"],',
              js,
              count=1,
          )
          js = re.sub(
              r'"rare of breed": \[[^\n]+\],',
              f'"rare of breed": ["/assets/artists/rare-of-breed-primary.jpg?v={TOKEN}"],',
              js,
              count=1,
          )
          repair_marker = '''  function repair(img) {\n    const key = artistKey(img);\n    const src = String(img.getAttribute("src") || "");\n'''
          repair_replacement = '''  function repair(img) {\n    const key = artistKey(img);\n    const src = String(img.getAttribute("src") || "");\n    const lockedPrimary = img?.dataset?.kcLockPrimary === "1";\n    if (lockedPrimary) {\n      // The final artifact has already selected a verified, self-hosted primary image.\n      // Never let runtime repair logic replace it with an older cached candidate.\n      img.onerror = () => { img.onerror = null; img.src = fallback; };\n      return;\n    }\n'''
          if repair_marker not in js and 'const lockedPrimary = img?.dataset?.kcLockPrimary === "1";' not in js:
              raise SystemExit("runtime repair marker not found")
          if repair_marker in js:
              js = js.replace(repair_marker, repair_replacement, 1)
          js_path.write_text(js, encoding="utf-8")
          Path(VERSIONED_SCRIPT).write_text(js, encoding="utf-8")

          # 2) Final artifact pass: cache-bust the primary image request itself, lock it
          # against runtime mutation, and use a unique runtime-script filename so stale
          # CDN/browser copies of the old repair code can never run on newly deployed HTML.
          py_path = Path("scripts/finalize_live_event_images.py")
          py = py_path.read_text(encoding="utf-8")

          constants_marker = 'FALLBACK = "/assets/event-fallback.webp"\n'
          constants_addition = (
              constants_marker
              + f'PRIMARY_CACHE_TOKEN = "{TOKEN}"\n'
              + f'RUNTIME_SCRIPT_URL = "{VERSIONED_SCRIPT_URL}"\n'
          )
          if 'PRIMARY_CACHE_TOKEN =' not in py:
              if constants_marker not in py:
                  raise SystemExit("finalizer constants marker not found")
              py = py.replace(constants_marker, constants_addition, 1)
          else:
              py = re.sub(r'PRIMARY_CACHE_TOKEN = "[^"]+"', f'PRIMARY_CACHE_TOKEN = "{TOKEN}"', py, count=1)
              py = re.sub(r'RUNTIME_SCRIPT_URL = "[^"]+"', f'RUNTIME_SCRIPT_URL = "{VERSIONED_SCRIPT_URL}"', py, count=1)

          set_marker = '''def set_img_src(tag: str, src: str, key: str) -> str:\n    escaped = html.escape(src, quote=True)\n'''
          set_replacement = '''def set_img_src(tag: str, src: str, key: str) -> str:\n    if key in {"rare of breed", "yumiya!"} and src.startswith("/assets/artists/"):\n        separator = "&" if "?" in src else "?"\n        src = f"{src}{separator}v={PRIMARY_CACHE_TOKEN}"\n    escaped = html.escape(src, quote=True)\n'''
          if set_marker not in py and 'separator = "&" if "?" in src else "?"' not in py:
              raise SystemExit("finalizer set_img_src marker not found")
          if set_marker in py:
              py = py.replace(set_marker, set_replacement, 1)

          cleanup_marker = '''    tag = re.sub(r'\\s+data-kc-image-index=(["\\']).*?\\1', "", tag, flags=re.I | re.S)\n    return tag[:-1] + (\n        f' data-kc-event-artist="{html.escape(key, quote=True)}" data-kc-image-index="0" '\n'''
          cleanup_replacement = '''    tag = re.sub(r'\\s+data-kc-image-index=(["\\']).*?\\1', "", tag, flags=re.I | re.S)\n    tag = re.sub(r'\\s+data-kc-lock-primary=(["\\']).*?\\1', "", tag, flags=re.I | re.S)\n    lock_attr = ' data-kc-lock-primary="1"' if key in {"rare of breed", "yumiya!"} else ""\n    return tag[:-1] + (\n        f' data-kc-event-artist="{html.escape(key, quote=True)}" data-kc-image-index="0"{lock_attr} '\n'''
          if cleanup_marker not in py and 'lock_attr = \' data-kc-lock-primary="1"\'' not in py:
              raise SystemExit("finalizer lock marker not found")
          if cleanup_marker in py:
              py = py.replace(cleanup_marker, cleanup_replacement, 1)

          script_marker = '''    script_tag = '<script src="/assets/event-image-repair.js"></script>'\n    if script_tag not in text and "</head>" in text.lower():\n        text = re.sub(r'</head>', script_tag + '</head>', text, count=1, flags=re.I)\n'''
          script_replacement = '''    script_tag = f'<script src="{RUNTIME_SCRIPT_URL}"></script>'\n    text = re.sub(\n        r'<script\\s+src="/assets/event-image-repair[^\"]*\\.js[^\"]*"\\s*></script>',\n        script_tag,\n        text,\n        flags=re.I,\n    )\n    if script_tag not in text and "</head>" in text.lower():\n        text = re.sub(r'</head>', script_tag + '</head>', text, count=1, flags=re.I)\n'''
          if script_marker not in py and 'script_tag = f\'<script src="{RUNTIME_SCRIPT_URL}"></script>\'' not in py:
              raise SystemExit("finalizer script marker not found")
          if script_marker in py:
              py = py.replace(script_marker, script_replacement, 1)

          # Strengthen final audit: the deployed HTML must use the versioned repair script;
          # standalone Rare/yumiya card/detail images must be locked and cache-busted.
          verify_marker = '''    retired_artist_links = 0\n    for page in root.rglob("*.html"):\n        text = page.read_text(encoding="utf-8", errors="ignore")\n'''
          verify_replacement = '''    retired_artist_links = 0\n    stale_runtime_script_refs = 0\n    unlocked_primary_images = 0\n    versioned_script_path = root / RUNTIME_SCRIPT_URL.lstrip("/")\n    if not versioned_script_path.is_file():\n        failures.append(f"missing-versioned-runtime-script:{RUNTIME_SCRIPT_URL}")\n    for page in root.rglob("*.html"):\n        text = page.read_text(encoding="utf-8", errors="ignore")\n        if '/assets/event-image-repair.js"' in text:\n            stale_runtime_script_refs += 1\n        for block in CARD_RE.findall(text):\n            if "rare-of-breed-primary.jpg" in block or "yumiya-primary.jpg" in block:\n                tags = re.findall(r'<img\\b[^>]*>', block, flags=re.I)\n                for tag in tags:\n                    if "rare-of-breed-primary.jpg" in tag or "yumiya-primary.jpg" in tag:\n                        if f"?v={PRIMARY_CACHE_TOKEN}" not in html.unescape(tag) or 'data-kc-lock-primary="1"' not in tag:\n                            unlocked_primary_images += 1\n'''
          if verify_marker not in py and 'stale_runtime_script_refs = 0' not in py:
              raise SystemExit("finalizer verify marker not found")
          if verify_marker in py:
              py = py.replace(verify_marker, verify_replacement, 1)

          event_verify_marker = '''        if page.parent.parent == root / "event":\n            sources = re.findall(r'<img\\b[^>]*?\\ssrc=["\\']([^"\\']+)', text, flags=re.I)\n'''
          event_verify_replacement = '''        if page.parent.parent == root / "event":\n            if "rare-of-breed-primary.jpg" in text or "yumiya-primary.jpg" in text:\n                media = re.search(r'<div[^>]*class="[^"]*event-detail-media[^"]*"[^>]*>\\s*(<img\\b[^>]*>)', text, flags=re.I | re.S)\n                if not media or f"?v={PRIMARY_CACHE_TOKEN}" not in html.unescape(media.group(1)) or 'data-kc-lock-primary="1"' not in media.group(1):\n                    unlocked_primary_images += 1\n            sources = re.findall(r'<img\\b[^>]*?\\ssrc=["\\']([^"\\']+)', text, flags=re.I)\n'''
          if event_verify_marker not in py and 'media = re.search' not in py:
              raise SystemExit("finalizer event verify marker not found")
          if event_verify_marker in py:
              py = py.replace(event_verify_marker, event_verify_replacement, 1)

          failures_marker = '''    if retired_artist_links:\n        failures.append(f"retired-artist-links:{retired_artist_links}")\n    if failures:\n'''
          failures_replacement = '''    if retired_artist_links:\n        failures.append(f"retired-artist-links:{retired_artist_links}")\n    if stale_runtime_script_refs:\n        failures.append(f"stale-runtime-script-refs:{stale_runtime_script_refs}")\n    if unlocked_primary_images:\n        failures.append(f"unlocked-primary-images:{unlocked_primary_images}")\n    if failures:\n'''
          if failures_marker not in py and 'stale-runtime-script-refs' not in py:
              raise SystemExit("finalizer failure marker not found")
          if failures_marker in py:
              py = py.replace(failures_marker, failures_replacement, 1)

          return_marker = '''        "retiredArtistLinks": retired_artist_links,\n    }\n'''
          return_replacement = '''        "retiredArtistLinks": retired_artist_links,\n        "staleRuntimeScriptRefs": stale_runtime_script_refs,\n        "unlockedPrimaryImages": unlocked_primary_images,\n    }\n'''
          if return_marker in py and '"staleRuntimeScriptRefs"' not in py:
              py = py.replace(return_marker, return_replacement, 1)

          py_path.write_text(py, encoding="utf-8")

          # 3) Add a source-level regression test so future edits cannot silently remove
          # the cache-bust/lock behavior.
          test_path = Path("tests/test_multipage_site.py")
          test = test_path.read_text(encoding="utf-8")
          if "def test_event_image_cache_busting_is_durable" not in test:
              insertion = f'''\n    def test_event_image_cache_busting_is_durable(self):\n        finalizer = (ROOT / "scripts/finalize_live_event_images.py").read_text(encoding="utf-8")\n        runtime = (ROOT / "assets/event-image-repair.js").read_text(encoding="utf-8")\n        versioned = ROOT / "{VERSIONED_SCRIPT}"\n        self.assertTrue(versioned.is_file())\n        self.assertIn('PRIMARY_CACHE_TOKEN = "{TOKEN}"', finalizer)\n        self.assertIn('RUNTIME_SCRIPT_URL = "{VERSIONED_SCRIPT_URL}"', finalizer)\n        self.assertIn('data-kc-lock-primary', finalizer)\n        self.assertIn('kcLockPrimary', runtime)\n        self.assertIn('?v={TOKEN}', runtime)\n\n'''
              test = test.replace('\nif __name__ == "__main__":\n', insertion + '\nif __name__ == "__main__":\n', 1)
              test_path.write_text(test, encoding="utf-8")
          PY

          python -m py_compile scripts/finalize_live_event_images.py tests/test_multipage_site.py
          node --check assets/event-image-repair.js
          node --check assets/event-image-repair-kc2050.js
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit cache-safe image pipeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/event-image-repair.js assets/event-image-repair-kc2050.js scripts/finalize_live_event_images.py tests/test_multipage_site.py
          git commit -m "Make event images cache-safe on Safari"
          git push origin HEAD:main
