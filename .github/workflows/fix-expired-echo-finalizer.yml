name: Fix expired ECHO release guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-expired-echo-finalizer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make ECHO guard expiration-aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_echo_nights_official.py')
          text = path.read_text(encoding='utf-8')
          old = '''def apply(root: Path) -> dict[str, int]:\n    root = root.resolve()\n    image_path = root / IMAGE\n'''
          new = '''def apply(root: Path) -> dict[str, int]:\n    root = root.resolve()\n    public_artifact = root.name == "_site" or (root / "seo-build-manifest.json").is_file()\n\n    # Completed events are intentionally removed from the deploy artifact.\n    # Once ECHO Nights has been pruned, its historical artwork guard must not\n    # turn that expected absence into a release failure. If a historical HTML\n    # page is still present, keep pinning that page before returning.\n    if public_artifact:\n        current_event_present = False\n        for filename in SOURCE_FILES:\n            source_path = root / filename\n            if not source_path.is_file():\n                continue\n            try:\n                rows = json.loads(source_path.read_text(encoding="utf-8"))\n            except (OSError, json.JSONDecodeError):\n                continue\n            if any(isinstance(row, dict) and row.get("id") == EVENT_ID for row in rows):\n                current_event_present = True\n                break\n        if not current_event_present:\n            historical_html_present = any(\n                TITLE in html.unescape(page.read_text(encoding="utf-8", errors="ignore"))\n                for page in root.rglob("*.html")\n            )\n            if not historical_html_present:\n                return {"jsonFilesPinned": 0, "htmlPagesPinned": 0, "expiredEventAbsent": 1}\n\n    image_path = root / IMAGE\n'''
          if 'expiredEventAbsent' not in text:
              if text.count(old) != 1:
                  raise SystemExit('Could not uniquely locate ECHO apply() insertion point')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_echo_nights_official.py')
          text = test.read_text(encoding='utf-8')
          marker = '''    def test_public_artifact_pin_does_not_restore_private_source_fields(self):\n'''
          addition = '''    def test_completed_event_absence_does_not_block_public_release(self):\n        with tempfile.TemporaryDirectory() as temp:\n            site = Path(temp) / "_site"\n            site.mkdir()\n            (site / "seo-build-manifest.json").write_text("{}", encoding="utf-8")\n            for filename in echo_nights.SOURCE_FILES:\n                (site / filename).write_text("[]", encoding="utf-8")\n\n            self.assertEqual(\n                {"jsonFilesPinned": 0, "htmlPagesPinned": 0, "expiredEventAbsent": 1},\n                echo_nights.apply(site),\n            )\n\n'''
          if 'test_completed_event_absence_does_not_block_public_release' not in text:
              if marker not in text:
                  raise SystemExit('Could not locate ECHO regression-test insertion point')
              test.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
          python -m unittest tests.test_echo_nights_official -v
      - name: Commit expiration-aware guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_echo_nights_official.py tests/test_echo_nights_official.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make ECHO release guard expiration-aware"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
