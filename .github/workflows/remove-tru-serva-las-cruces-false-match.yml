name: Remove false TRU-SERVA Las Cruces match

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-pages
  cancel-in-progress: false
  queue: max

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove false TRU-SERVA Las Cruces listing
        id: repair
        run: |
          python scripts/remove_false_tru_serva.py
      - name: Validate repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for file_name in ('supplemental-events.json', 'events.json', 'config/manual-events.json'):
              path = Path(file_name)
              if not path.exists():
                  continue
              rows = json.loads(path.read_text(encoding='utf-8'))
              bad = [e for e in rows if str(e.get('title') or '').strip() == 'The Truth Tour — Las Cruces' and any(str(a).strip().casefold() == 'tru-serva' for a in (e.get('artists') or []))]
              assert not bad, f'{file_name} still contains false TRU-SERVA Las Cruces listing'
          PY
      - name: Commit durable repair
        if: steps.repair.outputs.changed == 'true'
        run: |
          python scripts/publish_automation_changes.py \
            --message "Remove false TRU-SERVA Las Cruces listing [skip ci]" \
            --replay "python scripts/remove_false_tru_serva.py" \
            config/manual-events.json events.json supplemental-events.json data/verified-false-matches.json
