name: Live Browser Retest

on:
  workflow_run:
    workflows: ["Update and deploy show calendar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingdom-circuit-live-browser-check-${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
  cancel-in-progress: true

jobs:
  browser-retest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Test current navigation, filters, profiles and mobile layout
        run: python scripts/live_browser_retest.py
      - name: Preserve audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-audit
          path: browser-audit/
          retention-days: 14
