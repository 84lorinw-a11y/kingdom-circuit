name: Fix artist image fidelity

on:
  push:
    paths:
      - '.github/workflows/fix-artist-image-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Force verified image overrides into rendered artist pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_approved_seo.py')
          text = path.read_text(encoding='utf-8')
          old = '''def apply_artist_fidelity(root: pathlib.Path) -> None:\n    finalizer = load_module("kc_approved_finalizer", SEO_SOURCE / "finalize_test_seo.py")\n    finalizer.BASE = BASE\n    artists = finalizer.resolve_live_artists(root)\n    finalizer.patch_directory(root, artists)\n    finalizer.patch_artist_profiles(root, artists)\n'''
          new = '''def apply_artist_fidelity(root: pathlib.Path) -> None:\n    finalizer = load_module("kc_approved_finalizer", SEO_SOURCE / "finalize_test_seo.py")\n    finalizer.BASE = BASE\n    artists = finalizer.resolve_live_artists(root)\n\n    # Production-verified image overrides are authoritative over legacy image\n    # values merged by the pinned SEO renderer. Force them into the resolved\n    # artist model before rendering directory/profile images.\n    image_overrides = load_verified_image_overrides(root)\n    overrides_by_name = {str(name).strip().casefold(): url for name, url in image_overrides.items()}\n    for artist in artists:\n        override = overrides_by_name.get(str(artist.get("name") or "").strip().casefold())\n        if override:\n            artist["_resolvedImage"] = override if override.startswith("https://") else "/" + override.lstrip("/")\n            artist["_resolvedFallback"] = ""\n\n    finalizer.patch_directory(root, artists)\n    finalizer.patch_artist_profiles(root, artists)\n'''
          if old not in text:
              raise SystemExit('apply_artist_fidelity target block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/apply_approved_seo.py
      - name: Commit durable fidelity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_approved_seo.py
          git commit -m "Honor verified artist image overrides in SEO render"
          git push origin HEAD:main
