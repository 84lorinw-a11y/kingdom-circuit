name: One-time apply verified content overrides

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-verified-content-overrides-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply and validate verified content overrides
        run: python scripts/apply_verified_content_overrides.py

      - name: Persist corrected data and durable workflow step
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/artists.json events.json supplemental-events.json .github/workflows/update-and-deploy.yml
          if git diff --cached --quiet; then
            echo "Verified content overrides already persisted."
            exit 0
          fi
          git commit -m "Fix Caleb image Hope Fest art and indie tribe tour [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another safe automation commit; rebasing and retrying ($attempt/3)."
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to persist verified content overrides."
          exit 1
