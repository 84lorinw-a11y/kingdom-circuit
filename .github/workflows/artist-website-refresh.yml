name: Refresh official artist website shows

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_artist_website_events.py"
      - "scripts/merge_artist_website_events.py"
      - "scripts/sync_verified_artist_registry.py"
      - "scripts/sync_verified_artist_websites.py"
      - "config/verified-artist-registry-updates.json"
      - "config/verified-artist-websites.json"
      - "config/artist-website-seed-events.json"
      - ".github/workflows/artist-website-refresh.yml"
  workflow_run:
    workflows: ["Update and deploy show calendar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-artist-websites-${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')) }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync verified artist registry
        run: python scripts/sync_verified_artist_registry.py

      - name: Sync verified official websites
        run: python scripts/sync_verified_artist_websites.py

      - name: Collect all show sources for a registry update
        if: github.event_name == 'push'
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_priority_source_fallbacks.py
          python scripts/update_events.py
          python scripts/apply_curated_catalog_policy.py
          python scripts/apply_sevin_official_schedule.py
          git checkout -- config/official-sources.json

      - name: Validate website collector
        run: |
          python -m py_compile scripts/collect_artist_website_events.py scripts/merge_artist_website_events.py scripts/sync_verified_artist_websites.py
          python -m unittest tests.test_artist_website_ingestion -v

      - name: Scan every tracked official artist website
        env:
          ARTIST_WEBSITE_MIN_INTERVAL: "0.20"
        run: python scripts/collect_artist_website_events.py

      - name: Merge website shows into calendar
        run: python scripts/merge_artist_website_events.py

      - name: Reapply verified corrections after all imports
        run: python scripts/replay_source_update.py normalize

      - name: Run production tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Save discovered shows and synced registry
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ARTIST_WEBSITE_MIN_INTERVAL: "0.20"
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "chore: refresh verified artist shows" \
            --replay "python scripts/replay_source_update.py websites" \
            events.json supplemental-events.json config/manual-events.json config/artists.json app.js coverage-gaps.json run-status.json artist-website-events.json artist-website-status.json config/verified-artist-websites.json tests/test_update_events.py cache/ticketmaster-attractions.json event-history.json config/permanent-state-pages.json
