name: Fix event image cache v2

on:
  push:
    paths:
      - '.github/workflows/fix-event-image-cache-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version self-hosted event images and repair source metadata
        shell: bash
        run: |
          set -euo pipefail

          cp assets/artists/rare-of-breed.webp assets/artists/rare-of-breed-v2.webp
          cp assets/artists/yumiya.webp assets/artists/yumiya-v2.webp

          python - <<'PY'
          import json
          from pathlib import Path

          RARE = 'assets/artists/rare-of-breed-v2.webp'
          YUMIYA = 'assets/artists/yumiya-v2.webp'

          def norm(v):
              return str(v or '').strip().casefold()

          def patch_events(path):
              p = Path(path)
              data = json.loads(p.read_text(encoding='utf-8'))
              rare = genesis = 0
              for e in data:
                  artists = [norm(x) for x in (e.get('artists') or [])]
                  title = norm(e.get('title'))
                  headliner = norm(e.get('headliner'))
                  if 'rare of breed' in artists and (headliner == 'rare of breed' or title.startswith('rare of breed')):
                      e['image'] = RARE
                      e['imageType'] = 'artist'
                      e['imagePosition'] = 'center'
                      rare += 1
                  if e.get('id') == 'bandsintown:108758638' or 'the genesis show' in title:
                      e['image'] = YUMIYA
                      e['imageType'] = 'artist'
                      e['imagePosition'] = 'center'
                      genesis += 1
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print(path, 'rare=', rare, 'genesis=', genesis)
              return rare, genesis

          rare_total = genesis_total = 0
          for filename in ['events.json', 'supplemental-events.json']:
              r, g = patch_events(filename)
              rare_total += r
              genesis_total += g
          if rare_total < 3:
              raise SystemExit(f'Expected at least 3 standalone Rare of Breed records, got {rare_total}')
          if genesis_total < 1:
              raise SystemExit('Genesis event was not found')

          p = Path('config/artists.json')
          artists = json.loads(p.read_text(encoding='utf-8'))
          seen = set()
          for a in artists:
              name = norm(a.get('name'))
              if name == 'rare of breed':
                  a['imageUrl'] = RARE
                  a['imageSource'] = 'Kingdom Circuit local verified artist image v2'
                  seen.add(name)
              elif name == 'yumiya!':
                  a['imageUrl'] = YUMIYA
                  a['imageSource'] = 'Kingdom Circuit local verified artist image v2'
                  seen.add(name)
          if seen != {'rare of breed', 'yumiya!'}:
              raise SystemExit(f'Artist image records missing: {seen}')
          p.write_text(json.dumps(artists, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          p = Path('config/verified-artist-image-overrides.json')
          overrides = json.loads(p.read_text(encoding='utf-8'))
          overrides['Rare of Breed'] = RARE
          overrides['yumiya!'] = YUMIYA
          p.write_text(json.dumps(overrides, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          replacements = {
              '/assets/artists/rare-of-breed.webp': '/assets/artists/rare-of-breed-v2.webp',
              'assets/artists/rare-of-breed.webp': 'assets/artists/rare-of-breed-v2.webp',
              '/assets/artists/yumiya.webp': '/assets/artists/yumiya-v2.webp',
              'assets/artists/yumiya.webp': 'assets/artists/yumiya-v2.webp',
          }
          for filename in [
              'assets/event-image-repair.js',
              'scripts/finalize_live_event_images.py',
              'tests/test_multipage_site.py',
          ]:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          p = Path('tests/test_multipage_site.py')
          text = p.read_text(encoding='utf-8')
          marker = '''        self.assertTrue((ROOT / "assets/artists/yumiya-v2.webp").is_file())\n'''
          addition = '''        self.assertTrue((ROOT / "assets/artists/yumiya-v2.webp").is_file())\n        rare_asset = ROOT / "assets/artists/rare-of-breed-v2.webp"\n        yumiya_asset = ROOT / "assets/artists/yumiya-v2.webp"\n        fallback_asset = ROOT / "assets/event-fallback.webp"\n        self.assertGreater(rare_asset.stat().st_size, 10000)\n        self.assertGreater(yumiya_asset.stat().st_size, 10000)\n        self.assertNotEqual(rare_asset.read_bytes(), fallback_asset.read_bytes())\n        self.assertNotEqual(yumiya_asset.read_bytes(), fallback_asset.read_bytes())\n'''
          if marker in text and 'rare_asset.stat().st_size' not in text:
              text = text.replace(marker, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/finalize_live_event_images.py tests/test_multipage_site.py
          node --check assets/event-image-repair.js
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit permanent image-path fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artists/rare-of-breed-v2.webp assets/artists/yumiya-v2.webp \
            assets/event-image-repair.js config/artists.json config/verified-artist-image-overrides.json \
            events.json supplemental-events.json scripts/finalize_live_event_images.py \
            tests/test_multipage_site.py
          git commit -m "Version Rare of Breed and Genesis event images"
          git push origin HEAD:main
