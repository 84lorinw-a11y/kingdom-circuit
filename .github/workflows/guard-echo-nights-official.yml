name: Guard ECHO Nights official artwork

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-pages
  cancel-in-progress: false
  queue: max

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce ECHO Nights listing and official artwork
        run: python scripts/apply_echo_nights_official.py

      - name: Save repair when needed
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "fix: enforce ECHO Nights 26 official artwork" \
            --replay "python scripts/apply_echo_nights_official.py" \
            events.json supplemental-events.json
