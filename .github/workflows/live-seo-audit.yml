name: SEO Gap Postprocess

on:
  push:
    branches: [audit/all-524-pages-2026-08-18]
    paths:
      - .github/workflows/live-seo-audit.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Analyze crawled 524-page inventory
        shell: bash
        run: |
          python - <<'PY'
          import json, re, statistics
          from collections import Counter
          from pathlib import Path
          p=Path('audit-output/all-524-pages.json')
          rows=json.loads(p.read_text())
          by={}
          for t in sorted(set(r['type'] for r in rows)):
              rr=[r for r in rows if r['type']==t]
              wc=[r['word_count'] for r in rr]
              by[t]={
                  'count':len(rr),
                  'word_count_min':min(wc),
                  'word_count_median':statistics.median(wc),
                  'word_count_avg':round(statistics.mean(wc),1),
                  'word_count_max':max(wc),
              }
          artists=[r for r in rows if r['type']=='artist']
          events=[r for r in rows if r['type']=='event']
          cities=[r for r in rows if r['type']=='city']
          states=[r for r in rows if r['type']=='state']
          months=[r for r in rows if r['type']=='month']
          suspicious_city=[r for r in cities if '/shows/sponsor-' in r['url']]
          parenthetical_like=[r for r in cities if any(x in r['url'] for x in ['fair-oaks-sacramento','leander-austin','richmond-houston','southlake-dallas'])]
          dup_year=[r for r in events if re.search(r'-2026-2026-',r['url'])]
          result={
              'page_type_metrics':by,
              'artist_pages_le_100_words':sum(r['word_count']<=100 for r in artists),
              'artist_pages_le_125_words':sum(r['word_count']<=125 for r in artists),
              'artist_pages_ge_200_words':sum(r['word_count']>=200 for r in artists),
              'artist_titles_with_tickets':sum('ticket' in r['title'].lower() for r in artists),
              'artist_titles_with_concerts':sum('concert' in r['title'].lower() for r in artists),
              'artist_titles_with_tour_dates':sum('tour dates' in r['title'].lower() for r in artists),
              'state_titles_with_year':sum(bool(re.search(r'20\d\d',r['title'])) for r in states),
              'city_titles_with_year':sum(bool(re.search(r'20\d\d',r['title'])) for r in cities),
              'month_titles_with_year':sum(bool(re.search(r'20\d\d',r['title'])) for r in months),
              'suspicious_sponsor_city_pages_count':len(suspicious_city),
              'suspicious_sponsor_city_pages':[r['url'] for r in suspicious_city],
              'metro_parenthetical_city_pages_count':len(parenthetical_like),
              'metro_parenthetical_city_pages':[r['url'] for r in parenthetical_like],
              'event_urls_with_duplicate_2026_count':len(dup_year),
              'event_urls_with_duplicate_2026':[r['url'] for r in dup_year],
              'core_titles':{r['url']:r['title'] for r in rows if r['type'] in {'home','core'}},
          }
          Path('audit-output/seo-gap-analysis.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Save analysis
        run: |
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-output/seo-gap-analysis.json
          git commit -m "Record SEO gap analysis [skip ci]" || true
          git push origin HEAD:audit/all-524-pages-2026-08-18
