name: Live SEO Audit

# Daily publications run the same verifier inside update-and-deploy.yml with
# that build's expected manifest. This manual check audits the current live site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingdom-circuit-live-seo-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out publication verifier
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit current live publication
        id: live-publication-audit
        run: |
          python scripts/verify_live_publication.py \
            --base-url https://kingdomcircuit.com \
            --report live-publication-audit.json \
            --summary live-publication-audit.md

      - name: Verify current Pacific date and calendar windows
        run: python scripts/calendar_maintenance.py --live https://kingdomcircuit.com --output calendar-freshness-live.json

      - name: Summarize current live publication audit
        if: always()
        shell: bash
        env:
          LIVE_AUDIT_OUTCOME: ${{ steps.live-publication-audit.outcome || 'not run' }}
        run: |
          printf '## Manual live publication audit\n\nResult: %s\n\nThis check audits the current published manifest. The deployment workflow separately verifies its own expected release.\n\n' "$LIVE_AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -s live-publication-audit.md ]; then
            cat live-publication-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep live publication audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-publication-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-publication-audit.json
            live-publication-audit.md
            calendar-freshness-live.json
          if-no-files-found: ignore
          retention-days: 14
