name: Fix image verifier

on:
  push:
    paths:
      - '.github/workflows/fix-image-verifier.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make image verification HTML-entity aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_approved_seo.py')
          text = p.read_text(encoding='utf-8')
          if 'import html\n' not in text:
              text = text.replace('import importlib.util\n', 'import importlib.util\nimport html\n', 1)
          old = '''        text = page.read_text(encoding="utf-8", errors="ignore")\n        if "seo-profile-image seo-profile-placeholder" in text:\n            failures.append(f"artist-image-placeholder:{artist_name}")\n        if image_url not in text:\n            failures.append(f"artist-image-url-missing:{artist_name}")\n        if image_url not in directory:\n            failures.append(f"directory-image-url-missing:{artist_name}")\n'''
          new = '''        text = page.read_text(encoding="utf-8", errors="ignore")\n        decoded_text = html.unescape(text)\n        decoded_directory = html.unescape(directory)\n        if "seo-profile-image seo-profile-placeholder" in text:\n            failures.append(f"artist-image-placeholder:{artist_name}")\n        if image_url not in decoded_text:\n            failures.append(f"artist-image-url-missing:{artist_name}")\n        if image_url not in decoded_directory:\n            failures.append(f"directory-image-url-missing:{artist_name}")\n'''
          if old not in text:
              raise SystemExit('image verification block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/apply_approved_seo.py
      - name: Commit durable verifier fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_approved_seo.py
          git commit -m "Verify escaped artist image URLs correctly"
          git push origin HEAD:main
