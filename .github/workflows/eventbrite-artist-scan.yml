name: Scan Eventbrite for roster artists

on:
  push:
    branches: [main]
    paths:
      - "scripts/scan_eventbrite_artists.py"
      - ".github/workflows/eventbrite-artist-scan.yml"
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-eventbrite-scan
  cancel-in-progress: true

jobs:
  scan-eventbrite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan every enabled artist on Eventbrite
        run: |
          python -m py_compile scripts/scan_eventbrite_artists.py
          python scripts/scan_eventbrite_artists.py

      - name: Save Eventbrite audit
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "chore: refresh Eventbrite artist audit [skip ci]" \
            --replay "python scripts/scan_eventbrite_artists.py" \
            eventbrite-scan-status.json eventbrite-scan-candidates.json
