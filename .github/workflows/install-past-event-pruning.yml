name: Install permanent past-event pruning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pruning script
        run: |
          python -m py_compile scripts/prune_past_events.py
          cp events.json /tmp/events.json
          cp supplemental-events.json /tmp/supplemental-events.json
          python scripts/prune_past_events.py --source . --cutoff 2026-08-28
          mv /tmp/events.json events.json
          mv /tmp/supplemental-events.json supplemental-events.json

      - name: Patch production workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/update-and-deploy.yml')
          text = path.read_text(encoding='utf-8')

          source_anchor = '''      - name: Apply curated catalog policy and coverage audit\n        run: python scripts/apply_curated_catalog_policy.py\n\n'''
          source_insert = '''      - name: Apply curated catalog policy and coverage audit\n        run: python scripts/apply_curated_catalog_policy.py\n\n      - name: Remove completed shows from source data\n        run: python scripts/prune_past_events.py --source .\n\n'''
          if 'Remove completed shows from source data' not in text:
              if source_anchor not in text:
                  raise SystemExit('Source pruning insertion point not found')
              text = text.replace(source_anchor, source_insert, 1)

          test_anchor = '''          test -s scripts/apply_curated_catalog_policy.py\n'''
          if 'test -s scripts/prune_past_events.py' not in text:
              if test_anchor not in text:
                  raise SystemExit('Script validation insertion point not found')
              text = text.replace(test_anchor, test_anchor + '          test -s scripts/prune_past_events.py\n', 1)

          artifact_anchor = '''      - name: Apply verified live artist artifact cleanup\n        run: python scripts/apply_live_artist_overrides.py --site _site\n\n'''
          artifact_insert = '''      - name: Apply verified live artist artifact cleanup\n        run: python scripts/apply_live_artist_overrides.py --site _site\n\n      - name: Remove completed shows from deployment artifact\n        run: python scripts/prune_past_events.py --site _site\n\n'''
          if 'Remove completed shows from deployment artifact' not in text:
              if artifact_anchor not in text:
                  raise SystemExit('Artifact pruning insertion point not found')
              text = text.replace(artifact_anchor, artifact_insert, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production workflow update
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-and-deploy.yml
          if git diff --cached --quiet; then
            echo "Production workflow already contains pruning safeguards."
            exit 0
          fi
          git commit -m "Prune completed shows from live deployments"
          git push origin HEAD:main
