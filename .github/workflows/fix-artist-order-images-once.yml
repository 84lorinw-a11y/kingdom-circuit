name: One-time fix artist order and images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-artist-order-images-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical artist order and verified image metadata
        run: python scripts/apply_aug20_artist_order_images.py

      - name: Validate runtime JavaScript
        run: node --check app.js

      - name: Run automated tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Persist corrected artist data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js config/artists.json
          if git diff --cached --quiet; then
            echo "Artist order/image metadata already correct."
            exit 0
          fi
          git commit -m "Fix artist order and verified images [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to persist artist order/image correction."
          exit 1
