name: Archive event history

on:
  push:
    branches: [main]
    paths:
      - "events.json"
      - "supplemental-events.json"
      - "scripts/archive_event_history.py"
      - ".github/workflows/archive-event-history.yml"
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-event-history
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archive current calendar state and git history
        run: python scripts/archive_event_history.py

      - name: Validate history file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("event-history.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("historyVersion") == 2
          assert isinstance(data.get("events"), list)
          assert data.get("summary", {}).get("totalArchived") == len(data["events"])
          assert data.get("summary", {}).get("gitSnapshotsScanned", 0) >= 1
          print("Archived events:", len(data["events"]))
          PY

      - name: Save event history
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "chore: archive event history [skip ci]" \
            --replay "python scripts/archive_event_history.py" \
            event-history.json
