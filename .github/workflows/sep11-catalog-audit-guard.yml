name: Enforce September 11 catalog audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update and deploy show calendar"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sep11-catalog-audit-guard
  cancel-in-progress: true

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce verified catalog audit and artist exclusion
        run: python scripts/enforce_sep11_catalog_audit.py

      - name: Regenerate artist registry
        run: python scripts/sync_verified_artist_registry.py

      - name: Re-enforce after registry generation
        run: python scripts/enforce_sep11_catalog_audit.py

      - name: Run project tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Save durable audit corrections
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "Apply verified Sep 11 catalog audit [catalog audit]" \
            --replay "python scripts/replay_source_update.py audit" \
            events.json supplemental-events.json config/manual-events.json config/artists.json app.js coverage-gaps.json tests/test_update_events.py
