name: Enforce September 11 catalog audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update and deploy show calendar"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sep11-catalog-audit-guard
  cancel-in-progress: true

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce verified catalog audit and artist exclusion
        run: python scripts/enforce_sep11_catalog_audit.py

      - name: Regenerate artist registry
        run: python scripts/sync_verified_artist_registry.py

      - name: Re-enforce after registry generation
        run: python scripts/enforce_sep11_catalog_audit.py

      - name: Run project tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Save durable audit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-catalog-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          clean_runtime_artifacts() {
            find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
            find . -type f -name '*.pyc' -delete || true
          }

          recompute_audit() {
            python scripts/enforce_sep11_catalog_audit.py
            python scripts/sync_verified_artist_registry.py
            python scripts/enforce_sep11_catalog_audit.py
            python -m unittest discover -s tests -p 'test_*.py' -v
            clean_runtime_artifacts
          }

          clean_runtime_artifacts
          git add -A
          if git diff --cached --quiet; then
            echo "Catalog audit already enforced."
            exit 0
          fi

          git commit -m "Apply verified Sep 11 catalog audit [catalog audit]"
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi

            echo "Push raced with another safe automation commit; recomputing from latest main ($attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            recompute_audit
            git add -A

            if git diff --cached --quiet; then
              echo "Latest main already satisfies the catalog audit."
              PUSHED=1
              break
            fi

            git commit -m "Apply verified Sep 11 catalog audit [catalog audit]"
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "Unable to save catalog audit corrections after retries."
            exit 1
          fi
