name: Enforce Kingdom Circuit catalog curation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-catalog-curation
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply editorial catalog policy
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_curated_catalog_policy.py
          python scripts/apply_curated_catalog_policy.py

      - name: Reapply verified Sep 13 content repairs
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_sep13_content_repairs.py
          python scripts/apply_sep13_content_repairs.py

      - name: Reapply verified Miles Minnick and CJ Emulous repairs
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_miles_cj_fall_2026_repairs.py
          python scripts/apply_miles_cj_fall_2026_repairs.py

      - name: Reapply promoter-submitted TRNSCND VA 2026 show
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_trnscnd_submission.py
          python scripts/apply_trnscnd_submission.py

      - name: Preserve official Rock the Pines 2027 announcement
        run: python scripts/apply_rock_the_pines.py

      - name: Preserve verified EGR and Bizzle event details and artwork
        run: python scripts/apply_egr_bizzle_updates.py

      - name: Preserve submitted Man Of FAITH, Southside Joz and Bobby Real Montgomery shows
        run: python scripts/apply_man_of_faith_joz_shows.py

      - name: Preserve verified September 26 concert source corrections
        run: python scripts/apply_sep26_source_corrections.py

      - name: Persist curated catalog changes
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "Curate CHH roster and verified event coverage" \
            --replay "python scripts/replay_source_update.py catalog" \
            events.json supplemental-events.json config/manual-events.json config/artists.json app.js coverage-gaps.json
