name: Enforce Kingdom Circuit catalog curation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-catalog-curation
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply editorial catalog policy
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_curated_catalog_policy.py
          python scripts/apply_curated_catalog_policy.py

      - name: Reapply verified Sep 13 content repairs
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_sep13_content_repairs.py
          python scripts/apply_sep13_content_repairs.py

      - name: Reapply verified Miles Minnick and CJ Emulous repairs
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_miles_cj_fall_2026_repairs.py
          python scripts/apply_miles_cj_fall_2026_repairs.py

      - name: Reapply promoter-submitted TRNSCND VA 2026 show
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_trnscnd_submission.py
          python scripts/apply_trnscnd_submission.py

      - name: Persist curated catalog changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-curation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The policy and verified-event repairs can update auxiliary tracked
          # files too. Commit their complete output so subsequent collection
          # and audit pushes cannot erase manually verified Sep 13 records.
          git add -A

          if git diff --cached --quiet; then
            echo "Catalog already matches editorial policy and verified event repairs."
            exit 0
          fi

          git commit -m "Curate CHH roster and verified event coverage"
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "Push raced with another commit; rebasing and retrying ($attempt/3)."
            git fetch origin main
            git rebase origin/main
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "Unable to persist curated catalog changes after retries."
            exit 1
          fi
