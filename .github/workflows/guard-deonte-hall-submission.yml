name: Guard Deonte Hall submitted show

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update and deploy show calendar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deonte-hall-submission-guard
  cancel-in-progress: true

jobs:
  enforce:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Deonte Hall verified submission
        run: python scripts/apply_deonte_hall_submission.py

      - name: Verify official Facebook details
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected_id = "submitted:deonte-hall-truth-in-action-battle-creek-2026"
          expected_post = "https://www.facebook.com/share/p/18y8svvmDm/?mibextid=wwXIfr"
          expected_artwork = "https://www.facebook.com/photo/download/?fbid=2995157700824677"
          expected_source = "https://www.facebook.com/deonte.hall.98832/photos/-battle-creek-michigan-im-coming-im-super-thankful-and-humbled-to-announce-that-/2995157700824677/"

          supplemental = json.loads(Path("supplemental-events.json").read_text(encoding="utf-8"))
          matches = [event for event in supplemental if event.get("id") == expected_id]
          assert len(matches) == 1, matches
          event = matches[0]
          assert event.get("officialUrl") == expected_post, event
          assert event.get("image") == expected_artwork, event
          assert event.get("imageSource") == expected_source, event
          assert event.get("imageOverride") is True, event
          assert event.get("imageType") == "event_artwork", event
          print("Deonte Hall official Facebook link and event artwork are protected.")
          PY

      - name: Save corrected Deonte Hall data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- supplemental-events.json events.json config/artists.json config/verified-artist-registry-updates.json
          if git diff --cached --quiet; then
            echo "Deonte Hall listing already correct."
            exit 0
          fi
          git commit -m "fix: restore Deonte Hall official show details"
          git pull --rebase origin main
          git push origin HEAD:main
