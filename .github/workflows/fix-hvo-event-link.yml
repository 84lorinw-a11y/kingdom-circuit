name: Keep HVO Fest official details on Eventbrite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-hvo-link-fix
  cancel-in-progress: true

jobs:
  fix-hvo-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct HVO Fest official details link
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preserve_hvo_link.py

      - name: Persist correction
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "Fix HVO Fest official details link [skip ci]" \
            --replay "python scripts/preserve_hvo_link.py" \
            config/manual-events.json events.json supplemental-events.json
