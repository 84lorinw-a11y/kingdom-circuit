name: Fix Light in the Darkness artwork v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-light-in-darkness-art-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull official Eventbrite artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html as html_lib
          import json
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          event_url = "https://www.eventbrite.com/e/light-in-the-darkness-tickets-1997479295343"

          def get(url, accept):
              req = Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept": accept,
                  "Accept-Language": "en-US,en;q=0.9",
                  "Referer": event_url,
              })
              with urlopen(req, timeout=30) as response:
                  return response.read(), response.headers.get("Content-Type", "")

          page_bytes, _ = get(event_url, "text/html,application/xhtml+xml")
          page = page_bytes.decode("utf-8", errors="replace")

          def iter_objects(value):
              if isinstance(value, dict):
                  yield value
                  graph = value.get("@graph")
                  if isinstance(graph, list):
                      for item in graph:
                          yield from iter_objects(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from iter_objects(item)

          def image_url(value):
              if isinstance(value, str) and value.startswith(("http://", "https://")):
                  return value
              if isinstance(value, dict):
                  for key in ("url", "contentUrl", "thumbnailUrl"):
                      found = image_url(value.get(key))
                      if found:
                          return found
              if isinstance(value, list):
                  for item in value:
                      found = image_url(item)
                      if found:
                          return found
              return ""

          art_url = ""
          scripts = re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', page, flags=re.I | re.S)
          for raw in scripts:
              try:
                  value = json.loads(html_lib.unescape(raw).strip())
              except Exception:
                  continue
              for obj in iter_objects(value):
                  typ = obj.get("@type")
                  types = typ if isinstance(typ, list) else [typ]
                  if any(str(t).casefold() in {"event", "musicevent"} for t in types if t):
                      art_url = image_url(obj.get("image"))
                      if art_url:
                          break
              if art_url:
                  break

          if not art_url:
              patterns = (
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
              )
              for pattern in patterns:
                  match = re.search(pattern, page, flags=re.I)
                  if match:
                      art_url = html_lib.unescape(match.group(1)).replace("\\u002F", "/").replace("\\/", "/")
                      break

          if not art_url.startswith(("http://", "https://")):
              raise SystemExit("Could not resolve official Eventbrite artwork URL")

          image_bytes, content_type = get(art_url, "image/avif,image/webp,image/apng,image/*,*/*;q=0.8")
          if len(image_bytes) < 5000:
              raise SystemExit(f"Official artwork unexpectedly small: {len(image_bytes)} bytes")
          if "image" not in content_type.lower():
              raise SystemExit(f"Official artwork response was not an image: {content_type}")

          Path("/tmp/light-in-the-darkness-2026.webp").write_bytes(image_bytes)
          print(f"Downloaded official Eventbrite artwork ({len(image_bytes)} bytes)")
          PY

      - name: Commit artwork against latest main and deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Deploy attempt $attempt/8"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p assets/events
            rm -f assets/events/light-in-the-darkness-2026.jpg assets/events/light-in-the-darkness-2026.jpeg assets/events/light-in-the-darkness-2026.png assets/events/light-in-the-darkness-2026.avif
            cp /tmp/light-in-the-darkness-2026.webp assets/events/light-in-the-darkness-2026.webp

            python3 - <<'PY'
            import json
            from pathlib import Path

            event_id = "1997479295343"
            event_url = "https://www.eventbrite.com/e/light-in-the-darkness-tickets-1997479295343"
            image = "assets/events/light-in-the-darkness-2026.webp"
            matched = 0

            for path in (Path("events.json"), Path("supplemental-events.json"), Path("config/manual-events.json")):
                if not path.exists():
                    continue
                try:
                    rows = json.loads(path.read_text(encoding="utf-8"))
                except Exception:
                    continue
                if not isinstance(rows, list):
                    continue
                changed = False
                for row in rows:
                    if not isinstance(row, dict):
                        continue
                    urls = " ".join(str(row.get(k) or "") for k in ("ticketUrl", "officialUrl", "announcementUrl"))
                    title = str(row.get("title") or "").strip().casefold()
                    target = event_id in urls or (title == "light in the darkness" and str(row.get("startDate") or "") == "2026-10-31")
                    if not target:
                        continue
                    row["image"] = image
                    row["imageType"] = "event_artwork"
                    row["imagePosition"] = "center"
                    row["imageOverride"] = True
                    row["imageSource"] = "Official Eventbrite event artwork"
                    row["imageSourceUrl"] = event_url
                    matched += 1
                    changed = True
                if changed:
                    path.write_text(json.dumps(rows, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

            if matched == 0:
                raise SystemExit("Light in the Darkness event record was not found")
            print(f"Pinned official Eventbrite artwork on {matched} event record(s)")
            PY

            git add assets/events/light-in-the-darkness-2026.webp events.json supplemental-events.json config/manual-events.json
            if git diff --cached --quiet; then
              echo "Official Eventbrite artwork is already deployed."
              exit 0
            fi
            git commit -m "fix: use official Eventbrite art for Light in the Darkness"
            if git push origin HEAD:main; then
              echo "Artwork update pushed to main."
              exit 0
            fi
            sleep 2
          done

          echo "Unable to push artwork update after 8 race-safe retries."
          exit 1
