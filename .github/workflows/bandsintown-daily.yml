name: Daily Bandsintown discovery

on:
  push:
    branches: [main]
    paths:
      - scripts/collect_bandsintown_rest.py
      - scripts/run_bandsintown_refresh.py
      - .github/workflows/bandsintown-daily.yml
  schedule:
    - cron: "55 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-bandsintown
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect verified Bandsintown discoveries
        run: |
          python -m py_compile scripts/collect_bandsintown_rest.py scripts/run_bandsintown_refresh.py
          python scripts/run_bandsintown_refresh.py

      - name: Save Bandsintown results and trigger production deploy
        shell: bash
        run: |
          python scripts/publish_automation_changes.py \
            --message "chore: refresh Bandsintown discoveries" \
            --replay "python scripts/run_bandsintown_refresh.py" \
            supplemental-events.json bandsintown-status.json bandsintown-candidates.json
