name: Install Deonte Hall event artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-deonte-artwork.yml'
      - 'tmp/deonte-art-*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild supplied flyer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/events
          cat tmp/deonte-art-1.b64 tmp/deonte-art-2.b64 | base64 --decode > assets/events/deonte-hall-truth-in-action-2026.webp
          test -s assets/events/deonte-hall-truth-in-action-2026.webp
          test "$(stat -c%s assets/events/deonte-hall-truth-in-action-2026.webp)" -gt 15000
          test "$(head -c 4 assets/events/deonte-hall-truth-in-action-2026.webp)" = 'RIFF'
      - name: Commit permanent artwork and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kingdom-circuit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/events/deonte-hall-truth-in-action-2026.webp
          git rm tmp/deonte-art-1.b64 tmp/deonte-art-2.b64 .github/workflows/install-deonte-artwork.yml
          git commit -m 'fix: add Deonte Hall official event artwork'
          git pull --rebase origin main
          git push origin HEAD:main
