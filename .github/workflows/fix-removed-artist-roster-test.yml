name: Fix removed artist roster test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-removed-artist-roster-test.yml"

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired artist from legacy roster expectation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_update_events.py')
          text = path.read_text(encoding='utf-8')
          old = '"J.List", "BIG HOLY", "KJ-52"'
          new = '"J.List", "KJ-52"'
          if old not in text:
              raise SystemExit('Expected legacy BIG HOLY roster assertion was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit corrected test expectation
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_update_events.py
          git commit -m "Remove BIG HOLY from roster test expectation"
          git push origin HEAD:main
