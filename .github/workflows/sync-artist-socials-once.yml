name: One-time sync verified artist socials

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-artist-socials-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync verified registry links and show data
        run: python scripts/sync_artist_registry_socials_aug20.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Persist synchronized data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/artists.json events.json supplemental-events.json
          if git diff --cached --quiet; then
            echo "Registry data already synchronized."
            exit 0
          fi
          git commit -m "Sync verified artist socials and Brenno shows [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another automation commit; rebasing and retrying ($attempt/3)."
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to persist synchronized artist data."
          exit 1
