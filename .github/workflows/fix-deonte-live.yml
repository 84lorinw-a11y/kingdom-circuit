name: Fix Deonte Hall live listing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-deonte-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace unstable Facebook links and use supplied local flyer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_post = 'https://www.facebook.com/share/p/18y8svvmDm/?mibextid=wwXIfr'
          canonical_post = 'https://www.facebook.com/deonte.hall.98832/photos/-battle-creek-michigan-im-coming-im-super-thankful-and-humbled-to-announce-that-/2995157700824677/'
          old_art = 'https://www.facebook.com/photo/download/?fbid=2995157700824677'
          local_art = 'assets/events/deonte-hall-truth-in-action-2026.webp'

          text_exts = {'.py','.yml','.yaml','.json','.js','.html','.md','.txt'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old_post, canonical_post).replace(old_art, local_art)
              if path.as_posix() == 'scripts/apply_deonte_hall_submission.py':
                  updated = updated.replace('"address": "",', '"address": "111 Capital Ave NE",')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* Deonte Hall supplied event flyer */'
          rule = '''\n/* Deonte Hall supplied event flyer */\nimg[src*="deonte-hall-truth-in-action-2026"] {\n  object-fit: contain !important;\n  background: #050505;\n}\n'''
          if marker not in text:
              css.write_text(text.rstrip() + rule, encoding='utf-8')
          PY

          python scripts/apply_deonte_hall_submission.py

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('supplemental-events.json')
          events = json.loads(p.read_text(encoding='utf-8'))
          event = next(e for e in events if e.get('id') == 'submitted:deonte-hall-truth-in-action-battle-creek-2026')
          assert event['image'] == 'assets/events/deonte-hall-truth-in-action-2026.webp'
          assert event['officialUrl'].startswith('https://www.facebook.com/deonte.hall.98832/photos/')
          assert event['address'] == '111 Capital Ave NE'
          assert Path(event['image']).is_file()
          print('Verified Deonte Hall local flyer, canonical Facebook post, and venue address.')
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kingdom-circuit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-deonte-live.yml
          git add -A
          git commit -m 'fix: show Deonte Hall flyer and clean official details link'
          git pull --rebase origin main
          git push origin HEAD:main
