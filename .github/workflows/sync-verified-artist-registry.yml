name: Sync verified artist registry

on:
  push:
    branches: [main]
    paths:
      - "config/verified-artist-registry-updates.json"
      - "config/verified-artist-websites.json"
      - "scripts/sync_verified_artist_registry.py"
      - ".github/workflows/sync-verified-artist-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync verified artist registry
        run: python scripts/sync_verified_artist_registry.py

      - name: Validate synced roster and socials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artists = json.loads(Path('config/artists.json').read_text(encoding='utf-8'))
          updates = json.loads(Path('config/verified-artist-registry-updates.json').read_text(encoding='utf-8'))
          by_name = {artist['name'].casefold(): artist for artist in artists}

          assert len(artists) == 321, len(artists)
          assert len({artist['name'].casefold() for artist in artists}) == 321
          assert [artist['rosterOrder'] for artist in artists] == list(range(1, 322))
          assert [artist['name'] for artist in artists[54:78]] == [item['name'] for item in updates]
          assert artists[53]['name'] == '808 BEEZY'
          assert artists[78]['name'] == 'Alex Jean'

          for update in updates:
              artist = by_name[update['name'].casefold()]
              assert artist['sourceRegistryVerified'] is True
              for field in ('website', 'instagramProfile', 'spotifyProfile', 'youtubeProfile', 'officialImageSource'):
                  if update.get(field):
                      assert artist.get(field) == update[field], (update['name'], field)

          app = Path('app.js').read_text(encoding='utf-8')
          for name in ('Mike Teezy', 'Rua Young', 'Kurtis Hoppie', 'Nu Tone', 'Holy Gabbana', 'Christopher Syncere', 'K-SEE', 'Gospel Gangstaz', 'Wuhsahbee'):
              assert f'"{name}"' in app, name
          assert 'VERIFIED_ARTIST_REGISTRY_UPDATES' in app
          print('Verified artist rows 55-78 validated:', len(updates), 'rows; roster=', len(artists))
          PY

      - name: Run production tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
