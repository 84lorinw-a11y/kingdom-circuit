name: Fix Marty event image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-marty-event-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add verified Marty image
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          image = "https://img1.wsimg.com/isteam/ip/6ed0aa91-488e-49ff-a53b-8d885654844e/DSC07306%20Edited.jpg/:/cr=t:0%25,l:0%25,w:100%25,h:100%25/rs=w:600,cg:true"

          path = Path('supplemental-events.json')
          events = json.loads(path.read_text(encoding='utf-8'))
          found = 0
          for event in events:
              if event.get('id') == 'supplemental:marty-project-nation-kuna-2026':
                  event['image'] = image
                  event['imageType'] = 'artist'
                  found += 1
          if found != 1:
              raise SystemExit(f'Expected Marty Kuna event once, found {found}')
          path.write_text(json.dumps(events, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          finalizer = Path('scripts/finalize_live_event_images.py')
          text = finalizer.read_text(encoding='utf-8')
          marker = '''IMAGE_CANDIDATES = {\n'''
          addition = '''IMAGE_CANDIDATES = {\n    "marty": [\n        "https://img1.wsimg.com/isteam/ip/6ed0aa91-488e-49ff-a53b-8d885654844e/DSC07306%20Edited.jpg/:/cr=t:0%25,l:0%25,w:100%25,h:100%25/rs=w:600,cg:true",\n    ],\n'''
          if '"marty": [' not in text:
              if marker not in text:
                  raise SystemExit('IMAGE_CANDIDATES marker not found')
              text = text.replace(marker, addition, 1)
              finalizer.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile scripts/finalize_live_event_images.py
          python - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('supplemental-events.json').read_text())
          m=[e for e in events if e.get('id')=='supplemental:marty-project-nation-kuna-2026']
          assert len(m)==1 and m[0].get('image') and m[0].get('imageType')=='artist', m
          PY
      - name: Commit repair
        run: |
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supplemental-events.json scripts/finalize_live_event_images.py
          git commit -m "Add verified Marty event image [skip ci]"
          git push origin HEAD:main
